[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
# Streamlit's hot-reload module eviction can race with multipage imports.
# Load each published revision in a fresh process instead.
fileWatcherType = "none"

[theme]
primaryColor = "#008c95"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef6f6"
textColor = "#23313b"
